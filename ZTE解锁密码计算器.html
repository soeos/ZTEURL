
<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 标题：突出工具功能与适用设备 -->
    <title>ZTE解锁密码计算器 - 中兴随身WiFi设备解锁工具</title>
    
    <!-- 元描述：明确工具用途、操作方式和适用场景 -->
    <meta name="description" content="ZTE解锁密码计算器，输入随身WiFi设备IMEI最后6位数字，快速生成中兴MIFI设备解锁密码，支持多款中兴随身WiFi型号，免费在线使用。">
    
    <!-- 关键词：覆盖品牌、功能、设备类型 -->
    <meta name="keywords" content="ZTE解锁密码, 中兴随身WiFi解锁, IMEI计算器, 中兴MIFI解锁, 解锁密码生成工具, 随身WiFi解锁">
	
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f0f2f5;
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(45, 124, 247, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(45, 124, 247, 0.05) 0%, transparent 20%);
        }
        
        .container {
            background: #fff;
            padding: 40px 30px;
            margin-top: 60px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h2 {
            color: #2d7cf7;
            margin-bottom: 10px;
            font-size: 1.8rem;
            position: relative;
            display: inline-block;
        }
        
        h2:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: #2d7cf7;
            border-radius: 3px;
        }
        
        .tip {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
            padding: 10px 15px;
            background: #f5f8ff;
            border-left: 3px solid #2d7cf7;
            border-radius: 0 6px 6px 0;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        label {
            font-size: 1rem;
            color: #333;
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            margin: 5px 0;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #2d7cf7;
            box-shadow: 0 0 0 3px rgba(45, 124, 247, 0.1);
        }
        
        button {
            width: 100%;
            padding: 13px 0;
            background: #2d7cf7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }
        
        button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s ease;
        }
        
        button:hover {
            background: #1856b3;
            transform: translateY(-2px);
        }
        
        button:hover:before {
            left: 100%;
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 25px;
            font-size: 1.2rem;
            color: #1a7d2d;
            text-align: center;
            min-height: 32px;
            padding: 12px;
            background: #f0fff4;
            border-radius: 8px;
            border: 1px solid #c6e9d3;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        
        .result.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .error {
            color: #d32f2f;
            font-size: 1rem;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: #fff5f5;
            border-radius: 8px;
            border: 1px solid #ffd6d6;
            display: none;
        }
        
        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 0.9rem;
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .shake {
            animation: shake 0.5s ease;
            border-color: #d32f2f !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>ZTE 解锁密码计算器</h2>
        </div>
        <div class="tip">请输入设备 IMEI 的最后 <b>6 位数字</b>，点击“计算”按钮或按回车键获取解锁密码。</div>
        
        <div class="input-group">
            <label for="imei">IMEI 最后 6 位：</label>
            <input type="text" id="imei" maxlength="6" placeholder="如：901234">
        </div>
        
        <button onclick="calcPassword()">计算解锁密码</button>
        <div class="result" id="result"></div>
        <div class="error" id="error"></div>
        
        <div class="footer">
            Copyright© 2025 ORTECH
        </div>
    </div>

    <script>
        function zteUnlockPassword(imeiLast6) {
            const weights = [2, 3, 4, 5, 6, 7];
            let passwordChars = Array(6).fill('');
            for (let i = 5; i >= 0; i--) {
                let digit = parseInt(imeiLast6[5 - i], 10);
                let weight = weights[5 - i];
                let product = digit * weight;
                let quotient = Math.floor(product / 10);
                let remainder = product - 10 * quotient;
                passwordChars[i] = remainder.toString();
            }
            return passwordChars.join('');
        }

        function calcPassword() {
            const imeiInput = document.getElementById('imei');
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            let imei = imeiInput.value.trim();

            // 重置状态
            resultDiv.textContent = '';
            resultDiv.classList.remove('show');
            errorDiv.style.display = 'none';

            if (imei.length !== 6 || !/^\d{6}$/.test(imei)) {
                errorDiv.textContent = '请输入有效的 6 位数字！';
                errorDiv.style.display = 'block';
                // 添加抖动动画
                imeiInput.classList.add('shake');
                setTimeout(() => {
                    imeiInput.classList.remove('shake');
                }, 500);
                imeiInput.focus();
                return;
            }

            let password = zteUnlockPassword(imei);
            resultDiv.textContent = '解锁密码：' + password;
            // 显示结果动画
            setTimeout(() => {
                resultDiv.classList.add('show');
            }, 50);
        }

        // 支持回车键直接计算
        document.getElementById('imei').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                calcPassword();
            }
        });
    </script>
</body>
</html>
